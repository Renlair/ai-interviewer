<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 面试官</title>
<style>
:root {
  --bg: #f5f8ff; --fg: #1e293b; --muted: #64748b; --line: #e2e8f0; --card: #fff;
  --accent: #4f7cff; --accent-soft: #e8eeff;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif; }
/* 整页固定一屏高：顶部导航不动，每个页面在自己的区域里滚动。 */
main { max-width: 1120px; margin: 0 auto; padding: 0 16px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
main > section { flex: 1; min-height: 0; overflow-y: auto; }
/* 首页铺满宽度，其他页面保持适合阅读的窄栏。 */
main > section:not(#start) { width: 100%; max-width: 680px; margin: 0 auto; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
nav .brand { border: none; background: none; padding: 10px 0; font-weight: 700; }
nav .brand:hover:not(:disabled) { box-shadow: none; color: var(--accent); }
main > section { animation: pop .5s var(--spring); }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
h1 { font-size: 30px; margin: 0; font-weight: 700; }
.muted { color: var(--muted); }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 10px 20px; min-height: 44px;
  transition: transform .35s var(--spring), box-shadow .2s, background .2s, border-color .2s; }
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgb(79 124 255 / .15); border-color: var(--accent); }
button:active:not(:disabled) { transform: scale(.93); transition-duration: .1s; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
.options { display: flex; flex-wrap: wrap; gap: 10px; }
.options button { animation: pop .5s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
.link { border: none; background: none; color: var(--muted); padding: 10px 0; }
.link:hover:not(:disabled) { box-shadow: none; color: var(--accent); }
.step-nav { display: flex; gap: 24px; }
[hidden] { display: none !important; }

/* 聊天页只有消息列表滚动，输入框始终在底部。 */
#chat { display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
#log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; }
.msg { white-space: pre-wrap; max-width: 85%; padding: 10px 16px; border-radius: 18px; animation: pop .45s var(--spring); }
.msg.assistant { background: var(--card); box-shadow: 0 2px 10px rgb(30 41 59 / .06); align-self: flex-start; transform-origin: left bottom; border-bottom-left-radius: 6px; }
.msg.user { background: var(--accent); color: #fff; align-self: flex-end; transform-origin: right bottom; border-bottom-right-radius: 6px; }
form { padding: 12px 0 16px; display: flex; gap: 8px; align-items: flex-end; }
/* 输入框随内容长高，最多到屏幕的 40%，再多就在框内滚动。 */
#input { min-height: 46px; max-height: 40vh; overflow-y: auto; transition: border-color .2s, box-shadow .35s var(--spring), height .15s; }
textarea { flex: 1; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; resize: none; outline: none;
  transition: border-color .2s, box-shadow .35s var(--spring); }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
#report { white-space: pre-wrap; margin: 20px 0; padding: 20px; background: var(--card); border-radius: 18px; box-shadow: 0 2px 10px rgb(30 41 59 / .06); }
details { margin: 0 0 40px; }
summary { cursor: pointer; color: var(--muted); padding: 8px 0; }
.transcript { display: flex; flex-direction: column; gap: 14px; padding: 12px 0; }
#history-list { display: flex; flex-direction: column; gap: 12px; padding: 20px 0 40px; }
.record { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--card); border-radius: 18px; box-shadow: 0 2px 10px rgb(30 41 59 / .06); cursor: pointer;
  transition: transform .35s var(--spring), box-shadow .2s; }
.record:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgb(79 124 255 / .15); }
.record > div { flex: 1; min-width: 0; }
.record .muted { font-size: 14px; }
.material { padding: 20px 0 0; }
.material:last-child { padding-bottom: 40px; }
.material > div { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.material textarea { width: 100%; min-height: 180px; resize: vertical; }
#top { position: fixed; right: max(16px, calc(50vw - 340px)); bottom: 96px; width: 44px; padding: 0; box-shadow: 0 2px 10px rgb(30 41 59 / .12); animation: pop .35s var(--spring); }

/* ---- 首页：左边文字，右边演示 ---- */
#start { display: flex; align-items: center; }
.hero { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; padding: 24px 0; }
.hero h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.25; margin: 0 0 16px; }
.lead { font-size: 17px; color: var(--muted); margin: 0 0 32px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.cta [data-soon] { color: var(--muted); }
#continue { margin-top: 16px; }
.window { height: 380px; background: var(--card); border-radius: 22px; box-shadow: 0 20px 60px rgb(30 41 59 / .08); padding: 16px 18px; display: flex; flex-direction: column; overflow: hidden; }
.window-bar { padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
#demo { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding-top: 12px; overflow: hidden; }
#demo .msg { font-size: 14px; max-width: 88%; transition: opacity .5s; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
#toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; animation: pop .35s var(--spring); }

@media (max-width: 820px) {
  #start { align-items: flex-start; }
  .hero { grid-template-columns: 1fr; gap: 32px; }
  .window { height: 320px; }
}

/* ---- 开场动画：一面面屏幕铺开，再一个字一个字打出来，最后停在闪烁的下划线上 ---- */
#intro { position: fixed; inset: 0; z-index: 100; background: #0b1020; color: #e8eeff; overflow: hidden; cursor: pointer; transition: opacity .8s, transform .8s; }
#intro.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.panes { position: absolute; inset: 0; display: flex; }
.panes i { flex: 1; transform: scaleY(0); background: linear-gradient(180deg, #24306e, #4f7cff); border-right: 1px solid rgb(255 255 255 / .06);
  animation: unfold .7s cubic-bezier(.7, 0, .2, 1) forwards, fold .9s cubic-bezier(.7, 0, .2, 1) forwards; }
.panes i:nth-child(odd) { transform-origin: top; } .panes i:nth-child(even) { transform-origin: bottom; }
#intro-text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 48px));
  font: 500 clamp(22px, 3.4vw, 34px)/1.7 ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; white-space: pre-wrap; }
#intro-text .cursor { display: inline-block; width: .6em; border-bottom: 3px solid #8fa8ff; animation: caret 1s steps(1) infinite; }
#intro-skip { position: absolute; right: 24px; bottom: 24px; background: none; color: rgb(232 238 255 / .6); border-color: rgb(232 238 255 / .25); font-size: 14px; }

@keyframes unfold { to { transform: scaleY(1); } }
@keyframes fold { to { transform: scaleY(0); opacity: 0; } }
@keyframes caret { 50% { border-color: transparent; } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <nav>
    <button class="brand" data-go="home">AI 面试官</button>
    <span>
      <button class="link" data-go="profile">我的资料</button>
      <button class="link" data-go="history">历史记录</button>
    </span>
  </nav>

  <section id="start">
    <div class="hero">
      <div>
        <h1>把每一次面试，<br>都变成认清自己的机会</h1>
        <p class="lead">像真人面试官一样追问你的经历和判断，结束后逐题复盘。</p>
        <div class="cta">
          <button class="primary" data-go="step">模拟面试</button>
          <button data-soon="规划模式">规划模式</button>
          <button data-soon="面试辅导">面试辅导</button>
        </div>
        <button class="link" id="continue" hidden>继续上次的面试 →</button>
      </div>
      <div class="window" aria-hidden="true">
        <div class="window-bar" id="demo-stage">了解候选人</div>
        <div id="demo"></div>
      </div>
    </div>
  </section>

  <section id="step" class="center" hidden>
    <p class="muted" id="step-title"></p>
    <div class="options" id="step-options"></div>
    <div class="step-nav"><button class="link" id="step-back">← 上一步</button><button class="link" id="step-skip" hidden>跳过</button></div>
  </section>

  <section id="chat" hidden>
    <header>
      <span class="muted"><span id="timer">00:00</span> · <span id="stage"></span></span>
      <button id="end">结束面试</button>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="输入回答，随时可以打断面试官"></textarea>
      <button class="primary">发送</button>
    </form>
  </section>

  <section id="review" hidden>
    <header><strong>复盘报告</strong><button data-go="home">再面一场</button></header>
    <div id="report"></div>
    <details>
      <summary id="transcript-title">面试记录</summary>
      <div class="transcript" id="transcript"></div>
    </details>
  </section>

  <section id="profile" hidden>
    <header><strong>我的资料</strong><span class="muted">面试官会据此提问，只保存在这个浏览器里</span></header>
    <div class="material">
      <div><strong>简历</strong><button class="link" data-upload="resume">上传 PDF / Word / 文本</button></div>
      <textarea id="resume" placeholder="上传简历文件，或者直接粘贴简历内容"></textarea>
    </div>
    <div class="material">
      <div><strong>目标职位描述</strong><button class="link" data-upload="jd">上传文件</button></div>
      <textarea id="jd" placeholder="粘贴想投的职位描述（JD），面试官会对照里面的要求来考察"></textarea>
    </div>
    <input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden>
  </section>

  <section id="history" hidden>
    <header><strong>历史记录</strong><span class="muted">问答会存入知识库，供以后的面试参考</span></header>
    <div id="history-list"></div>
  </section>
</main>
<button id="top" title="回到顶部" hidden>↑</button>
<div id="toast" hidden></div>

<div id="intro" hidden>
  <div class="panes"></div>
  <div id="intro-text"></div>
  <button id="intro-skip">跳过</button>
</div>

<script>
const $ = id => document.getElementById(id);
const STEPS = [
  { key: 'role', title: '想面什么方向？', options: ['产品经理', 'AI 产品经理', '技术架构师', '技术负责人', '全栈开发', 'AI 应用开发'] },
  { key: 'level', title: '你现在的阶段？', options: ['实习 / 校招', '1-3 年', '3-5 年', '5 年以上'] },
  { key: 'domain', title: '熟悉或想去的业务领域？', options: ['电商', '金融 / 支付', '企业服务 / SaaS', '内容 / 社区', '本地生活', '教育', '游戏', 'AI 原生应用'], skippable: true },
];

let setup, messages, state, startedAt, timer, controller, session;

function show(id) {
  for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== id;
  updateTop();
}

const visible = id => !$(id).hidden;

// ---- 页面地址：每个页面有自己的 #/… 地址，浏览器的后退、前进和刷新都能用 ----
//   #/  首页          #/setup/<步骤>  选方向       #/interview/<场次>  面试
//   #/review/<场次>  复盘   #/history  历史记录   #/profile  我的资料
// 每条浏览记录带上 depth（第几页），"上一步"据此判断能不能直接后退。

function go(hash, replace) {
  const depth = history.state?.depth || 0;
  if (replace) history.replaceState({ depth }, '', hash);
  else if (location.hash !== hash) history.pushState({ depth: depth + 1 }, '', hash);
  route();
}

addEventListener('popstate', route);

function route() {
  const [, page, arg] = location.hash.split('/');
  const staying = page === 'interview' && arg === session?.id && visible('chat');
  if (!staying) {
    if (visible('chat')) leaveChat();
    controller?.abort(); // 离开复盘页时停止生成
  }
  const s = arg && loadHistory().find(x => x.id === arg);
  switch (page) {
    case 'setup': return renderStep(Number(arg) || 0);
    case 'interview':
      if (!s) return go('#/', true);
      if (s.ended) return go('#/review/' + s.id, true);
      return staying || resumeInterview(s);
    case 'review': return s ? renderReview(s) : go('#/', true);
    case 'profile': return show('profile');
    case 'history': return renderHistory();
    default: return renderStart();
  }
}

const LINKS = { home: '#/', step: '#/setup/0', profile: '#/profile', history: '#/history' };

document.addEventListener('click', e => {
  const to = e.target.closest('[data-go]')?.dataset.go;
  if (!to) return;
  if (to === 'step') saveDraft({ domain: '' }); // 每次从头选方向
  go(LINKS[to]);
});

// 面试中离开：暂停并保存，之后可以从首页或历史记录继续。
function leaveChat() {
  controller?.abort();
  clearInterval(timer);
  saveSession();
  setCurrent(null); // 主动离开的不在下次打开时自动恢复
  if (answers(session) && !session.ended) remember(session);
}

// ---- 回到顶部 ----

// 当前页面的滚动区域：聊天页是消息列表，其他页面是整个 section。
function scroller() {
  return visible('chat') ? $('log') : document.querySelector('main > section:not([hidden])');
}

function updateTop() {
  $('top').hidden = !(scroller()?.scrollTop > 300);
}

document.addEventListener('scroll', updateTop, true); // scroll 不冒泡，用捕获监听所有滚动区域
$('top').onclick = () => scroller().scrollTo({ top: 0, behavior: 'smooth' });

// ---- 选方向 ----

// 选到一半的方向存在 sessionStorage，刷新后还在。
const DRAFT = 'ai-interviewer:setup';

function loadDraft() {
  try { return JSON.parse(sessionStorage.getItem(DRAFT)) || { domain: '' }; } catch { return { domain: '' }; }
}

function saveDraft(d) {
  try { sessionStorage.setItem(DRAFT, JSON.stringify(d)); } catch {}
}

function renderStep(i) {
  setup = loadDraft();
  // 直接打开后面的步骤、但前面还没选时，回到第一个没选的步骤。
  const missing = STEPS.findIndex(st => !st.skippable && !setup[st.key]);
  if (missing >= 0 && missing < i) return go('#/setup/' + missing, true);
  if (i >= STEPS.length) return startInterview();

  const step = STEPS[i];
  const next = () => i + 1 === STEPS.length ? startInterview() : go('#/setup/' + (i + 1));
  $('step-title').textContent = step.title;
  $('step-options').replaceChildren(...step.options.map((o, idx) => {
    const b = document.createElement('button');
    b.style.setProperty('--i', idx);
    b.textContent = o;
    if (setup[step.key] === o) b.className = 'primary'; // 后退回来时标出之前的选择
    b.onclick = () => { setup[step.key] = o; saveDraft(setup); next(); };
    return b;
  }));
  $('step-skip').hidden = !step.skippable;
  $('step-skip').onclick = () => { setup[step.key] = ''; saveDraft(setup); next(); };
  // 上一步：前面还有本应用的页面就直接后退，否则（比如刷新后直接打开）跳到上一步的地址。
  $('step-back').onclick = () => history.state?.depth > 0 ? history.back() : go(i ? '#/setup/' + (i - 1) : '#/', true);
  show('step');
}

// ---- 面试 ----

// 新建一场面试并先存进历史，这样刚开场就刷新也能回来。
function startInterview() {
  const s = { id: Date.now().toString(36), at: Date.now(), setup, profile: loadProfile(), messages: [], seconds: 0, state: null };
  // 清掉以前开了个头、一句没答的面试。
  try { localStorage.setItem(STORE, JSON.stringify(loadHistory().filter(x => x.ended || answers(x)))); } catch {}
  putHistory(s);
  go('#/interview/' + s.id);
}

// 打开一场没结束的面试：恢复对话、阶段和已用时间。
// 还没开场，或者候选人的回答还没得到回复时，让面试官接着说。
function resumeInterview(s) {
  openChat(s);
  if (!messages.length || messages.at(-1).role === 'user') ask();
}

function openChat(s) {
  session = s;
  setup = s.setup;
  messages = s.messages.map(m => ({ ...m }));
  state = s.state || null;
  setCurrent(s.id);
  $('stage').textContent = state?.name || '';
  $('log').replaceChildren(...messages.map(m => msgEl(m.role, m.content)));
  $('input').disabled = !!s.closed;
  $('end').textContent = s.closed ? '查看复盘' : '结束面试';
  // 用时只算面试中的时间，暂停期间不计。
  startedAt = Date.now() - s.seconds * 1000;
  clearInterval(timer);
  const tick = () => {
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    $('timer').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  };
  tick();
  timer = setInterval(tick, 1000);
  show('chat');
  $('log').scrollTop = $('log').scrollHeight;
}

// 更新消息并滚到底部；用户往上翻看时（离底部较远）不打扰，除非 force。
function follow(update, force) {
  const log = $('log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  update();
  if (force || atBottom) log.scrollTop = log.scrollHeight;
}

function msgEl(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  return div;
}

function bubble(role, text) {
  const div = msgEl(role, text);
  follow(() => $('log').append(div), role === 'user');
  return div;
}

// 流式请求。ok 为 false 表示被中止或出错，此时 text 是已收到的部分。onRes 拿到响应头后调用。
async function streamTo(path, body, onText, onRes) {
  const ctrl = controller = new AbortController();
  let text = '', ok = true;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    onRes?.(res);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      text += decoder.decode(value, { stream: true });
      onText(text);
    }
  } catch (e) {
    ok = false;
    if (e.name !== 'AbortError') onText(text + '\n[网络错误]');
  }
  if (controller === ctrl) controller = null;
  return { text, ok: ok && !text.includes('[模型调用失败') };
}

async function ask() {
  const div = bubble('assistant', '…');
  const msg = { role: 'assistant', content: '' };
  messages.push(msg);
  const body = { setup, state, profile: session.profile, user: USER, session: session.id,
    messages: messages.filter(m => m.content), minutes: Math.floor((Date.now() - startedAt) / 60000) };
  const { text } = await streamTo('/api/chat', body, t => {
    if (msg.cut) return;
    msg.content = t;
    follow(() => { div.textContent = t.replace('[END]', '').trim(); });
  }, res => {
    // 后端每轮返回所处阶段，下一轮原样带回。
    const h = res.headers.get('X-Interview-State');
    if (!h) return;
    state = JSON.parse(decodeURIComponent(h));
    $('stage').textContent = state.name;
  });
  if (msg.cut) return;
  msg.content = text.replace('[END]', '').trim();
  if (text.includes('[END]')) {
    session.closed = true;
    $('input').disabled = true;
    $('end').textContent = '查看复盘';
  }
  saveSession();
}

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  // 打断：中止当前输出，保留面试官已说出的部分。
  if (controller) {
    controller.abort();
    const last = messages[messages.length - 1];
    last.cut = true;
    last.content = last.content.replace('[END]', '').trim() + '……（被候选人打断）';
  }
  $('input').value = '';
  grow();
  messages.push({ role: 'user', content: text });
  bubble('user', text);
  saveSession();
  ask();
};

// 输入框随内容长高（上限见 #input 的 max-height）。
function grow() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 2 + 'px';
}
$('input').oninput = grow;

$('input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
};

$('end').onclick = () => {
  controller?.abort();
  clearInterval(timer);
  session.ended = true;
  saveSession();
  go('#/review/' + session.id, true); // 替换掉面试页，后退不会再回到已结束的面试
};

// ---- 复盘 ----

// 展示一场面试的复盘和对话记录；还没有复盘时生成并保存。
async function renderReview(s) {
  show('review');
  $('transcript-title').textContent = `面试记录（${answers(s)} 轮回答）`;
  $('transcript').replaceChildren(...s.messages.map(m => msgEl(m.role, m.content)));
  $('transcript').parentElement.open = false;
  if (s.report) { $('report').textContent = s.report; return; }
  if (!answers(s)) { $('report').textContent = '这场面试你还没有回答任何问题，没有可复盘的内容。'; return; }
  $('report').textContent = '正在生成复盘…';
  const { text, ok } = await streamTo('/api/review', { setup: s.setup, profile: s.profile || {}, messages: s.messages }, t => { $('report').textContent = t; });
  if (ok && text) { s.report = text; putHistory(s); }
  remember(s); // 有没有复盘都写入，复盘生成后再写一次会覆盖
}

// ---- 历史记录：存在 localStorage，后端不保存 ----

const STORE = 'ai-interviewer:history';
const answers = s => s.messages.filter(m => m.role === 'user').length;

function loadHistory() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(STORE)) || []; } catch {}
  // 加上"继续面试"之前保存的记录没有 state 字段，都当作已结束。
  for (const s of list) if (!('state' in s)) s.ended = true;
  return list;
}

// 更新已有记录时保持原位置，新记录放最前。
function putHistory(s) {
  const list = loadHistory();
  const i = list.findIndex(x => x.id === s.id);
  if (i >= 0) list[i] = s; else list.unshift(s);
  list.splice(50);
  try { localStorage.setItem(STORE, JSON.stringify(list)); } catch {}
}

// 把当前面试（对话、阶段、用时）写入历史。
function saveSession() {
  if (!session) return;
  session.messages = messages.filter(m => m.content).map(({ role, content }) => ({ role, content }));
  session.state = state;
  if (!session.ended) session.seconds = Math.floor((Date.now() - startedAt) / 1000);
  putHistory(session);
}

// 正在进行的面试 ID：刷新或关掉页面后再打开，直接回到这场面试。
const CURRENT = 'ai-interviewer:current';

function setCurrent(id) {
  try { id ? localStorage.setItem(CURRENT, id) : localStorage.removeItem(CURRENT); } catch {}
}

const unfinished = () => loadHistory().filter(s => !s.ended && answers(s));

addEventListener('beforeunload', () => { if (visible('chat')) saveSession(); });

function renderHistory() {
  const list = loadHistory().filter(s => s.ended || answers(s));
  $('history-list').replaceChildren(...list.map(s => {
    const item = document.createElement('div');
    item.className = 'record';
    const info = document.createElement('div');
    const title = document.createElement('div');
    title.textContent = [s.setup.role, s.setup.level, s.setup.domain].filter(Boolean).join(' · ');
    const meta = document.createElement('div');
    meta.className = 'muted';
    const when = new Date(s.at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    meta.textContent = `${when} · ${Math.max(1, Math.round(s.seconds / 60))} 分钟 · ${answers(s)} 轮回答 · ${!s.ended ? '进行中' : s.report ? '已复盘' : '未复盘'}`;
    info.append(title, meta);
    const del = document.createElement('button');
    del.className = 'link';
    del.textContent = '删除';
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm('删除这条面试记录？')) return;
      try { localStorage.setItem(STORE, JSON.stringify(loadHistory().filter(x => x.id !== s.id))); } catch {}
      fetch(`/api/memory?user=${USER}&session=${s.id}`, { method: 'DELETE' }).catch(() => {});
      renderHistory();
    };
    item.append(info, del);
    item.onclick = () => go((s.ended ? '#/review/' : '#/interview/') + s.id);
    return item;
  }));
  if (!list.length) $('history-list').textContent = '还没有面试记录。';
  show('history');
}

// ---- 我的资料：简历和职位描述，存在 localStorage，每次面试随请求发给后端 ----

const PROFILE = 'ai-interviewer:profile';

function loadProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE)) || { resume: '', jd: '' }; } catch { return { resume: '', jd: '' }; }
}

function saveProfile() {
  try { localStorage.setItem(PROFILE, JSON.stringify({ resume: $('resume').value.trim(), jd: $('jd').value.trim() })); } catch {}
}

$('resume').oninput = $('jd').oninput = saveProfile;

let uploadTarget;
document.addEventListener('click', e => {
  const up = e.target.closest('[data-upload]')?.dataset.upload;
  if (!up) return;
  uploadTarget = up;
  $('file').value = '';
  $('file').click();
});

$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const box = $(uploadTarget), before = box.value;
  box.value = `正在读取 ${f.name}…`;
  box.disabled = true;
  try {
    const form = new FormData();
    form.append('file', f);
    const res = await fetch('/api/parse', { method: 'POST', body: form });
    if (!res.ok) throw new Error(await res.text());
    box.value = (await res.json()).text;
  } catch (e) {
    box.value = before;
    alert('读取失败：' + e.message);
  }
  box.disabled = false;
  saveProfile();
};

function renderStart() {
  $('continue').hidden = !unfinished().length;
  show('start');
}

$('continue').onclick = () => go('#/interview/' + unfinished()[0].id);

// ---- 面试记忆：每场面试切块、向量化后存进后端的向量库，以后面试时检索 ----

// 浏览器生成的匿名用户 ID，用来区分谁的历史面试。
const USER = (() => {
  const KEY = 'ai-interviewer:user';
  let id;
  try { id = localStorage.getItem(KEY); } catch {}
  if (!/^[a-z0-9]{1,40}$/.test(id || '')) {
    id = crypto.randomUUID().replaceAll('-', '');
    try { localStorage.setItem(KEY, id); } catch {}
  }
  return id;
})();

// 写入向量库；成功后标记 indexed，失败（比如后端没开检索）下次打开页面再试。
async function remember(s) {
  const body = { id: s.id, at: s.at, setup: s.setup, messages: s.messages, report: s.report || '' };
  try {
    const res = await fetch(`/api/memory?user=${USER}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) return;
    const saved = loadHistory().find(x => x.id === s.id);
    if (saved) { saved.indexed = !!s.report; putHistory(saved); }
  } catch {}
}

// 打开页面时，把还没写入（或写入时还没有复盘）的历史补写进去。
for (const s of loadHistory()) if (!s.indexed && answers(s)) remember(s);

// ---- 首页 ----

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2200);
}

document.addEventListener('click', e => {
  const soon = e.target.closest('[data-soon]')?.dataset.soon;
  if (soon) toast(`${soon}正在开发中，先试试模拟面试吧`);
});

// 右侧演示：循环播放一小段面试，只在首页可见时运行。
const DEMO = [
  { role: 'assistant', text: '最近在关注什么样的机会？', stage: '了解候选人' },
  { role: 'user', text: '想做电商的会员增长产品。' },
  { role: 'assistant', text: '你说会员转化率提升了 12%，这个转化率是怎么定义的？', stage: '经历深挖' },
  { role: 'user', text: '付费会员数除以当月活跃用户……' },
  { role: 'assistant', text: '为什么分母选活跃用户，而不是访问会员页的用户？' },
];

async function playDemo() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  for (;;) {
    $('demo').replaceChildren();
    $('demo-stage').textContent = DEMO[0].stage;
    for (const step of DEMO) {
      while (visible('intro') || !visible('start') || document.hidden) await sleep(500);
      let typing;
      if (step.role === 'assistant') {
        typing = msgEl('assistant', '');
        typing.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        $('demo').append(typing);
        await sleep(900);
      }
      const el = msgEl(step.role, step.text);
      typing ? typing.replaceWith(el) : $('demo').append(el);
      if (step.stage) $('demo-stage').textContent = step.stage;
      await sleep(step.role === 'user' ? 1200 : 1800);
    }
    await sleep(1500);
    for (const el of $('demo').children) el.style.opacity = 0;
    await sleep(600);
  }
}

// ---- 开场动画：只在第一次进来时播放（记在 localStorage） ----

const INTRO = 'ai-interviewer:intro-seen';
const INTRO_LINES = ['你好。', '面试从来不只是回答问题，', '而是一次又一次，', '认清真实的自己'];

function playIntro() {
  const box = $('intro'), text = $('intro-text');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // 每面屏幕先铺开，停顿后收起；奇偶两列从上下两个方向展开。
  box.querySelector('.panes').replaceChildren(...Array.from({ length: 7 }, (_, i) => {
    const pane = document.createElement('i');
    pane.style.animationDelay = `${i * 90}ms, ${900 + i * 70}ms`;
    return pane;
  }));
  text.replaceChildren();
  box.classList.remove('out');
  box.hidden = false;

  let done = false, timer;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { localStorage.setItem(INTRO, '1'); } catch {}
    box.classList.add('out');
    setTimeout(() => { box.hidden = true; }, 800);
  };
  box.onclick = finish;
  addEventListener('keydown', finish, { once: true });

  // 逐字打出，光标始终跟在最后；最后一行不加标点，停在闪烁的下划线上。
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  const all = INTRO_LINES.join('\n');
  let i = 0;
  const type = () => {
    if (done) return;
    if (i === 0) text.append(cursor);
    if (i < all.length) {
      cursor.before(all[i]);
      const pause = '，。'.includes(all[i]) ? 380 : all[i] === '\n' ? 260 : 85;
      i++;
      timer = setTimeout(type, pause);
    } else {
      timer = setTimeout(finish, 2200);
    }
  };
  timer = setTimeout(type, 1500);
}

let seen = false;
try { seen = localStorage.getItem(INTRO) === '1'; } catch {}
if (!seen) playIntro();
playDemo();

$('resume').value = loadProfile().resume;
$('jd').value = loadProfile().jd;
// 不带地址打开时，如果上次关页面时正在面试，直接回到那场面试。
let current;
try { current = localStorage.getItem(CURRENT); } catch {}
const last = loadHistory().find(s => s.id === current && !s.ended);
history.replaceState({ depth: 0 }, '', location.hash.length > 2 ? location.hash : last ? '#/interview/' + last.id : '#/');
route();
</script>
</body>
</html>
